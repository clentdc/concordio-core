name: CI

# Guards that keep concordio-core open, clean and consistent. Standard library only.
on:
  push:
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Data integrity (packs, slugs, manifests, service worker)
        run: python3 tests/test_data.py
      - name: No proprietary or secret material (tests/reserved-material.json)
        run: python3 tests/test_reserved_material.py
      - name: Licence statements agree with pack manifests
        run: python3 tests/test_licences.py
      - name: Cookbook recipes run against the packs
        run: python3 tests/test_cookbook.py
      - name: Reader syntax (web/js)
        run: |
          node --check web/js/app.js
          node --check web/js/versify.js
          node --check web/js/canon.js
          node --check web/sw.js
      - name: Psalm numbering (versify.json in the reader)
        run: node tests/test_versify.js
      - name: Canon selector (canon-extensions.json in the reader)
        run: node tests/test_canon.js
