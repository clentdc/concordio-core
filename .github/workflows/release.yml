name: Release

# Builds the two large interlinear packs (stepbible, bsb-tables; about 58 MB each, not stored in
# git) from the pinned upstream sources, packs them as reproducible tarballs with a SHA256SUMS
# file, and attaches them to a GitHub release.
#
#   * Push a tag `vX.Y.Z` (on a commit that is on main): builds, checks, and publishes the release.
#   * Run by hand (workflow_dispatch): a dry run. It builds, checks and uploads the files as a
#     workflow artifact only; it publishes nothing.
#
# Consumers fetch with `make fetch-release TAG=vX.Y.Z` (docs/UPDATES.md). Actions are pinned to
# commit SHAs; only the publish job has write access.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the dry-run files (vX.Y.Z; nothing is published)'
        default: 'v0.0.0-dryrun'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }

      - name: Check the version label
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION' is not a version tag like v0.1.0"; exit 1 ;;
          esac

      - name: Tag release checks (tag is on main and has a changelog entry)
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$VERSION is not on main; tag a commit that is"; exit 1; }
          grep -Eq "^## ${VERSION#v}( |$)" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## ${VERSION#v}' section"; exit 1; }

      - name: Build stepbible and bsb-tables from the pinned sources
        run: make release-packs

      - name: Run every check, including the samples against the full packs
        run: make check

      - name: Pack the tarballs, SHA256SUMS and release notes
        run: make release-assets VERSION="$VERSION"

      - name: Verify the checksums
        run: cd dist/release && sha256sum -c SHA256SUMS && ls -l

      - name: Nothing tracked changed during the build
        run: |
          test -z "$(git status --porcelain)" || { git status --porcelain; echo "::error::the build modified tracked files"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ env.VERSION }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    # Real releases only: a tag push. A manual run stops after `build`.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.ref_name }}
          path: release

      - name: Verify the checksums again before publishing
        run: cd release && sha256sum -c SHA256SUMS

      - name: Create the release
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" release/*.tar.gz release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Concordio Core $TAG" \
            --notes-file release/RELEASE-NOTES.md $flags
